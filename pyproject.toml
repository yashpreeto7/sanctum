[project]
name = "personal-ai-os"
version = "0.1.0"
description = "Local-first personal AI command center and autonomous automation system"
readme = "Personal AI OS — Master Project Specification & Development Blueprint.md"
requires-python = ">=3.11"
dependencies = [
    # Core API & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "websockets>=13.1",
    # AI & Agent Orchestration
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.7",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "instructor>=1.6.0",
    "ollama>=0.4.4",
    # RAG & Embeddings
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.1",
    "rank-bm25>=0.2.2",
    # Classical ML & Online Learning
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.2",
    "river>=0.21.2",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    # Integrations
    "google-api-python-client>=2.153.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # Utilities & Testing
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "rich>=13.9.4",
    "duckduckgo-search>=8.1.1",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["execution"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
